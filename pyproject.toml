[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-auto-resume"
version = "0.1.0-dev"
description = "Monitor local Codex/ChatGPT usage quota and automatically resume an interrupted ChatGPT Desktop Work session after the quota window resets."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "chatgpt-auto-resume contributors" }]
keywords = ["chatgpt", "codex", "automation", "quota", "windows", "pywinauto"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "cramjam>=2.8",
]

[project.optional-dependencies]
windows = [
    "pywinauto>=0.6.8",
    "pywin32>=306",
    "winotify>=1.1.0",
]
gui = [
    "PySide6>=6.5",
]
tray = [
    "pystray>=0.19.5",
    "Pillow>=10.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.scripts]
chatgpt-auto-resume = "app.main:cli_entry"

[tool.setuptools]
packages = [
    "app",
    "app.usage",
    "app.chatgpt",
    "app.discovery",
    "app.gui",
    "app.resume",
    "app.notification",
    "app.storage",
    "app.runtime",
    "app.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
